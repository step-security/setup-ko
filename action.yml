name: 'Setup ko'
description: 'Install and authorize ko'
author: 'step-security'
branding:
  icon: box
  color: green
inputs:
  version:
    description: 'Version of ko to install (tip, latest-release, v0.14.1, etc.)'
    required: true
    default: 'latest-release'
  use-sudo:
    description: 'set to true if install-dir location requires sudo privs'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
  - name: Subscription check
    env:
      REPO_PRIVATE: ${{ github.event.repository.private }}
    run: |
      UPSTREAM="ko-build/setup-ko"
      ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
      DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

      echo ""
      echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
      echo "Secure drop-in replacement for $UPSTREAM"
      if [ "$REPO_PRIVATE" = "false" ]; then
        echo -e "\033[32m✓ Free for public repositories\033[0m"
      fi
      echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
      echo ""

      if [ "$REPO_PRIVATE" != "false" ]; then
        SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

        if [ "$SERVER_URL" != "https://github.com" ]; then
          BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
        else
          BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
        fi

        API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

        RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "$BODY" \
          "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "Timeout or API not reachable. Continuing to next step."
        elif [ "$RESPONSE" = "403" ]; then
          echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
          echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
          exit 1
        fi
      fi
    shell: bash
    
  - shell: bash
    run: |
      set -ex

      SUDO=
      if [[ "${{ inputs.use-sudo }}" == "true" ]] && command -v sudo >/dev/null; then
        SUDO=sudo
      fi

      # Install ko:
      # - if version is "tip", install from tip of main.
      # - if version is "latest-release", look up latest release.
      # - otherwise, install the specified version.
      case ${{ inputs.version }} in
      tip)
        echo "Installing ko using go install"
        go install github.com/google/ko@main
        ;;
      latest-release)
        tag=$(curl -L -s -u "username:${{ github.token }}" https://api.github.com/repos/ko-build/ko/releases/latest | jq -r '.tag_name')
        ;;
      *)
        tag="${{ inputs.version }}"
      esac

      os=${{ runner.os }}
      arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
      if [[ $os == "macOS" ]]; then
        os="Darwin"
      fi
      if [[ $arch == "x64" ]]; then
        arch="x86_64"
      fi
      if [[ ! -z ${tag} ]]; then
        echo "Installing ko @ ${tag} for ${os} ${arch}"
        curl -fsL https://github.com/ko-build/ko/releases/download/${tag}/ko_${tag:1}_${os}_${arch}.tar.gz | $SUDO tar xzf - -C /usr/local/bin ko
      fi

      if [[ ! -z ${KO_DOCKER_REPO} ]]; then
        echo "KO_DOCKER_REPO is already set"
        echo "Skipping login to ghcr.io and passing KO_DOCKER_REPO=${KO_DOCKER_REPO} on to future steps"
        echo "KO_DOCKER_REPO=${KO_DOCKER_REPO}" >> $GITHUB_ENV
      else
        # NB: username doesn't seem to matter.
        echo "${{ github.token }}" | ko login ghcr.io --username "dummy" --password-stdin

        # Set KO_DOCKER_REPO for future steps.
        # We need to get the repository name in lowercase, otherwise it could fail
        repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "KO_DOCKER_REPO=ghcr.io/${repo}"
        echo "KO_DOCKER_REPO=ghcr.io/${repo}" >> $GITHUB_ENV
      fi
